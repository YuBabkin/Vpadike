<!DOCTYPE html>
<!--
  Файл: index.html
  Назначение: Одностраничное приложение «Доска объявлений» (в стилистике
  старой советской доски в подъезде). Отображает список заметок, позволяет
  добавлять новые и удалять старые. Взаимодействует с сервером по REST API:
    GET    /notes            — получить все заметки
    POST   /notes            — создать заметку
    DELETE /notes/<id>       — удалить заметку по id
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!--
      Мета-тег charset задаёт кодировку документа (UTF-8), что позволяет
      корректно отображать русский текст и любые другие символы Юникода.
    -->
    <title>ВП - Впадике</title>

    <style>
        /*
          ============================================================
          ОБЩИЕ СТИЛИ СТРАНИЦЫ
          ============================================================
        */

        /*
          Сброс (reset): для всех элементов box-sizing: border-box.
          Это значит, что padding и border элемента будут включены в его
          заданную ширину/высоту, а не добавлены к ним. Упрощает вёрстку.
        */
        * { box-sizing: border-box; }

        /*
          Стилизация элемента <body> — основной контейнер всей страницы.
        */
        body {
            font-family: 'Courier New', Courier, monospace; /* моноширинный шрифт — имитация печатной машинки */
            max-width: 700px;      /* ограничение ширины страницы для удобного чтения */
            margin: 0 auto;        /* центрирование страницы по горизонтали */
            min-height: 100vh;     /* страница занимает минимум всю высоту окна браузера */
            padding: 24px 16px 60px; /* отступы: сверху 24px, по бокам 16px, снизу 60px (чтобы футер не прилипал к краю) */
            color: #1c1c1c;        /* основной цвет текста — тёмно-серый */

            /*
              Фон страницы собран из двух градиентов:
              1. Первый градиент рисует тёмную горизонтальную полосу (линию
                 «обоев») на высоте ~60% от верха страницы.
              2. Второй градиент создаёт плавный переход цвета от светло-
                 бежевого (верх, «старые обои») к тёмно-зелёному (низ,
                 «покрашенная стена»).
            */
            background:
                linear-gradient(180deg,
                    rgba(0,0,0,0) 0%,       /* прозрачно в самом верху */
                    rgba(0,0,0,0) 60%,      /* прозрачно до отметки 60% */
                    rgba(0,0,0,0.28) 60%,   /* начало тёмной полосы */
                    rgba(0,0,0,0.28) 61.5%, /* конец тёмной полосы */
                    rgba(0,0,0,0) 61.5%),   /* снова прозрачно */
                linear-gradient(180deg,
                    #cfc9ad 0%,     /* светло-бежевый верх («обои») */
                    #c4bd9e 60%,    /* чуть темнее к середине */
                    #2f522c 61.5%,  /* резкий переход в зелёный («краска») */
                    #1d3a1c 100%);  /* тёмно-зелёный низ */
            background-attachment: fixed; /* фон «прилипает» к окну и не прокручивается вместе с содержимым */
        }

        /*
          ============================================================
          ЗАГОЛОВОК СТРАНИЦЫ (h1)
          ============================================================
        */

        /*
          Заголовок оформлен как «табличка» на доске: зелёный прямоугольник
          с несколькими рамками и тенью.
        */
        h1 {
            margin: 0 0 24px;      /* без внешнего отступа сверху, снизу 24px */
            padding: 14px;         /* внутренние отступы таблички */
            text-align: center;    /* текст по центру */
            text-transform: uppercase; /* весь текст заглавными буквами */
            letter-spacing: 4px;   /* увеличенный межбуквенный интервал */
            font-size: 22px;       /* размер шрифта заголовка */
            line-height: 1.4;      /* высота строки */
            color: #efe9cc;        /* светлый цвет текста */
            background: #274a26;   /* тёмно-зелёный фон таблички */
            border: 3px solid #14260f;      /* внешняя тёмная рамка */
            outline: 2px solid #4a7444;     /* дополнительная светлая рамка вокруг border */
            box-shadow: inset 0 0 0 2px #2d542b, 0 4px 10px rgba(0,0,0,0.4); /* внутренняя рамка + тень снизу */
            text-shadow: 1px 1px 0 #0e1d0c; /* тёмная тень текста для эффекта «выдавленных» букв */
        }

        /*
          Подзаголовок (вторая строка в табличке) — более мелкий текст.
          Класс .subtitle используется внутри <span> в теге h1.
        */
        h1 .subtitle {
            display: block;         /* превращает <span> в блочный элемент (занимает всю строку) */
            font-size: 12px;        /* мелкий шрифт */
            font-weight: normal;    /* обычная жирность, не жирный */
            letter-spacing: 1px;    /* небольшой межбуквенный интервал */
            text-transform: none;   /* не переводим в верхний регистр (в отличие от h1) */
            color: #cfd9b0;         /* светлый зеленоватый цвет */
            text-shadow: none;      /* убираем тень текста */
        }

        /*
          ============================================================
          ФОРМА ДОБАВЛЕНИЯ ЗАМЕТКИ (#noteForm)
          ============================================================
        */

        /*
          Форма стилизована как «бумажный бланк» на светлом фоне.
        */
        #noteForm {
            background: #f2ebd3;              /* светло-бежевый фон «бумаги» */
            border: 1px solid #b8ab7e;        /* тонкая коричневатая рамка */
            padding: 14px;                    /* внутренние отступы */
            margin-bottom: 26px;              /* отступ до списка заметок */
            box-shadow: 0 3px 8px rgba(0,0,0,0.3); /* тень, чтобы форма «приподнималась» над фоном */
        }

        /*
          Подписи (label) внутри формы.
        */
        #noteForm label {
            display: inline-block; /* блочно-строчный элемент: остаются на одной строке, но можно задать отступы */
            margin: 4px 10px 4px 0; /* отступы вокруг подписи */
            font-size: 13px;        /* мелкий шрифт подписей */
        }

        /*
          Строка формы: используется flex-контейнер, чтобы поля «Заголовок»
          и «Автор» располагались рядом в одну строку.
        */
        #noteForm .row {
            display: flex;   /* включаем flexbox-раскладку */
            gap: 6px;        /* расстояние между элементами строки */
            margin-bottom: 6px; /* отступ до следующего блока */
        }

        /*
          Текстовые поля (однострочные) и textarea (многострочные).
        */
        #noteForm input[type="text"],
        #noteForm textarea {
            width: 100%;          /* поля растягиваются на всю ширину */
            margin-bottom: 6px;    /* отступ снизу */
            padding: 7px 8px;      /* внутренние отступы в полях */
            font-family: inherit;  /* наследуем шрифт от родителя (не шрифт браузера по умолчанию) */
            font-size: 14px;       /* размер текста в полях */
            color: #2b2b2b;        /* цвет вводимого текста */
            background: #fdf8e7;   /* светлый фон полей */
            border: 2px solid #6d7d5f; /* зелёная рамка полей */
            border-radius: 0;      /* квадратные углы (без скругления) — в стиле старых форм */
        }

        /*
          Внутри строки .row однострочные поля не имеют нижнего отступа
          и делят доступное пространство поровну (flex: 1).
        */
        #noteForm .row input[type="text"] { margin-bottom: 0; flex: 1; }

        /*
          Поле выбора цвета (type="color") — компактный квадратик с палитрой.
        */
        #noteForm input[type="color"] {
            width: 40px;              /* ширина квадратика */
            height: 26px;             /* высота квадратика */
            border: 2px solid #6d7d5f; /* рамка в общем стиле */
            background: #fdf8e7;
            vertical-align: middle;   /* выравнивание по вертикали относительно текста подписи */
        }

        /*
          Числовое поле размера шрифта.
        */
        #noteForm input[type="number"] {
            width: 60px;              /* узкое поле */
            padding: 4px;
            font-family: inherit;
            border: 2px solid #6d7d5f;
            background: #fdf8e7;
        }

        /*
          Кнопка «Добавить».
        */
        #noteForm button[type="submit"] {
            display: block;         /* кнопка-блок на всю ширину */
            width: 100%;            /* ширина во всю форму */
            margin-top: 8px;        /* отступ сверху */
            padding: 8px;           /* внутренние отступы */
            font-family: inherit;
            font-weight: bold;      /* жирный текст */
            font-size: 15px;
            letter-spacing: 2px;    /* разреженный текст */
            text-transform: uppercase; /* заглавные буквы */
            color: #efe9cc;         /* светлый текст */
            background: #2f522c;    /* зелёный фон кнопки */
            border: 2px solid #14260f; /* тёмная рамка */
            box-shadow: inset 0 0 0 2px #4a7444; /* внутренняя светлая рамка */
            cursor: pointer;        /* курсор-«рука» при наведении */
        }

        /*
          Состояние кнопки при наведении курсора — фон становится светлее.
        */
        #noteForm button[type="submit"]:hover { background: #3a6836; }

        /*
          ============================================================
          КАРТОЧКИ ЗАМЕТОК (.note)
          ============================================================
        */

        /*
          Каждая заметка выглядит как бумажная карточка, приклеенная скотчем
          (см. псевдоэлемент ::before ниже).
        */
        .note {
            position: relative;         /* относительное позиционирование — нужно для псевдоэлемента скотча */
            background: #f1ead2;        /* светлый «бумажный» фон */
            border: 1px solid #c6bb95;  /* тонкая рамка */
            padding: 16px 14px 10px;    /* отступы внутри карточки */
            margin: 24px 10px 18px;     /* внешние отступы карточки */
            box-shadow: 2px 3px 9px rgba(0,0,0,0.35); /* тень для объёма */
        }

        /*
          Псевдоэлемент ::before — рисует «полоску скотча» над карточкой.
          Создаётся виртуальный блок, абсолютно позиционированный сверху.
        */
        .note::before {
            content: '';              /* обязательное свойство — без него псевдоэлемент не отобразится */
            position: absolute;       /* позиционируем относительно .note (у него position: relative) */
            top: -9px;                /* сдвиг выше верхней границы карточки */
            left: 50%;                /* центр по горизонтали */
            width: 96px;              /* ширина полоски скотча */
            height: 20px;             /* высота полоски скотча */
            transform: translateX(-50%) rotate(-1.5deg); /* смещение на пол-ширины влево + лёгкий наклон */
            background: rgba(211, 200, 156, 0.9);        /* полупрозрачный бежевый «скотч» */
            border-left: 1px dashed rgba(120,108,64,0.5);  /* рваные края слева — эффект надорванного скотча */
            border-right: 1px dashed rgba(120,108,64,0.5); /* рваные края справа */
        }

        /*
          Через карточку карточки наклон скотча в другую сторону — лёгкий «хаос»,
          как на настоящей доске.
        */
        .note:nth-child(even)::before { transform: translateX(-50%) rotate(2deg); }

        /*
          Чередование лёгких наклонов самих карточек, чтобы доска выглядела
          естественно и «неаккуратно» (как в реальном подъезде).
        */
        .note:nth-child(odd) { transform: rotate(0.25deg); }  /* нечётные карточки наклонены вправо */
        .note:nth-child(3n)  { transform: rotate(-0.4deg); }  /* каждая третья карточка наклонена влево */

        /*
          Шапка карточки: заголовок и автор размещаются в одной строке.
        */
        .note-head {
            display: flex;              /* flexbox-раскладка */
            align-items: baseline;      /* выравнивание по базовой линии текста */
            justify-content: space-between; /* заголовок слева, автор справа */
            gap: 8px;                   /* минимальный зазор между ними */
            margin-bottom: 8px;         /* отступ до текста заметки */
        }

        /*
          Заголовок заметки (h3 внутри карточки).
        */
        .note h3 {
            margin: 0;                         /* сбрасываем стандартный отступ h3 */
            font-family: Georgia, 'Times New Roman', serif; /* шрифт с засечками — контраст с моноширинным */
            font-size: 19px;                   /* размер заголовка */
            color: #2f2410;                    /* тёмно-коричневый цвет */
            text-decoration: underline;        /* подчёркивание — как «от руки» */
            text-decoration-color: rgba(120,108,64,0.5); /* полупрозрачный цвет подчёркивания */
            overflow-wrap: anywhere;           /* длинные слова переносятся, не ломая вёрстку */
        }

        /*
          Автор заметки — курсивный мелкий текст справа от заголовка.
        */
        .author {
            font-style: italic;       /* курсив */
            font-size: 12px;          /* мелкий шрифт */
            color: #5c4f30;           /* коричневатый цвет */
            white-space: nowrap;      /* не переносить текст автора на новую строку */
        }

        /*
          Перед текстом автора автоматически вставляется символ «карандашик».
        */
        .author::before { content: '✍ '; }

        /*
          Кнопка «Удалить».
        */
        .delete-btn {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase; /* заглавные буквы */
            color: #9a9a9a;            /* серый цвет текста */
            background: transparent;   /* прозрачный фон */
            border: 2px solid #9a9a9a; /* серая рамка */
            padding: 3px 10px;         /* компактные отступы */
            cursor: default;           /* курсор не меняется (кнопка выглядит «неактивной») */
            box-shadow: inset 0 0 0 1px #f1ead2; /* внутренняя светлая рамка */
            opacity: 0.6;              /* полупрозрачность */
        }

        /*
          При наведении кнопка удаления не реагирует (остаётся той же).
        */
        .delete-btn:hover { background: transparent; color: #9a9a9a; }

        /*
          Нижний блок метаданных карточки: дата, IP, браузер и прочая
          служебная информация о посетителе. Отделён пунктирной линией.
        */
        .note-meta {
            margin-top: 8px;                  /* отступ сверху */
            padding-top: 4px;                 /* внутренний отступ перед линией */
            border-top: 1px dashed rgba(120,108,64,0.4); /* пунктирная разделительная линия */
            font-size: 7px;                   /* очень мелкий текст-«приписка» */
            line-height: 1.5;                 /* высота строки */
            letter-spacing: 0;                /* без разреживания */
            color: #9a9278;                   /* серо-бежевый цвет */
            opacity: 0.75;                    /* полупрозрачность */
            overflow-wrap: anywhere;          /* перенос длинных строк (например, IP или GPU) */
        }

        /*
          ============================================================
          ПОДВАЛ СТРАНИЦЫ (footer)
          ============================================================
        */

        /*
          Надпись-предупреждение внизу страницы.
        */
        footer {
            text-align: center;   /* по центру */
            color: #efe9cc;       /* светлый текст на тёмно-зелёном фоне */
            font-size: 12px;      /* мелкий шрифт */
            letter-spacing: 1px;  /* небольшой межбуквенный интервал */
            margin-top: 30px;     /* отступ сверху */
            opacity: 0.85;        /* лёгкая полупрозрачность */
        }
    </style>
</head>

<body>
    <!--
      Заголовок страницы, стилизованный под табличку на доске.
      Подзаголовки (subtitle) уточняют «адрес» доски объявлений.
    -->
    <h1>Доска объявлений
        <span class="subtitle">3-й подъезд · пр-т Славы Комсомола, д. 5</span>
        <span class="subtitle">ЖЭК № 3 «Уют» · дежурная: тётя Зина</span>
    </h1>

    <!--
      Форма добавления новой заметки. Обрабатывается в JavaScript
      через обработчик onsubmit (см. скрипт внизу). Сама страница
      при отправке НЕ перезагружается (e.preventDefault()).
    -->
    <form id="noteForm">
        <!-- Ряд из двух полей: заголовок (обязательное) и автор (необязательное) -->
        <div class="row">
            <input type="text" id="titleInput" placeholder="Заголовок" required>
            <input type="text" id="authorInput" placeholder="Автор">
        </div>

        <!-- Многострочное поле для текста заметки (обязательное) -->
        <textarea id="contentInput" placeholder="Текст" required></textarea>

        <!-- Настройки оформления текста: цвет (HTML5 палитра) и размер шрифта -->
        <label>Цвет текста: <input type="color" id="colorInput" value="#000000"></label>
        <label>Размер шрифта: <input type="number" id="sizeInput" value="16" min="8" max="48"></label>

        <!-- Кнопка отправки формы -->
        <button type="submit">Добавить</button>
    </form>

    <!--
      Контейнер для списка заметок.
      Заметки подгружаются из бэкенда и вставляются сюда динамически
      функцией loadNotes() (см. скрипт ниже).
    -->
    <div id="notesList"></div>

    <!-- Подвал с «хулиганской» надписью для атмосферы -->
    <footer>Смотрите под ноги, не мусорите и не поджигайте лифт</footer>

    <script>
        /*
          ============================================================
          ФУНКЦИИ РАБОТЫ С ДАТАМИ И МЕТА-ДАННЫМИ ПОСЕТИТЕЛЯ
          ============================================================
        */

        /**
         * Преобразует дату из формата ISO (например, "2026-08-10T12:34:56")
         * в удобный для показа формат ДД.ММ.ГГГГ ЧЧ:ММ.
         *
         * @param {string} iso — дата в ISO-формате, приходящая с сервера
         * @returns {string} строка вида "10.08.2026 12:34" или пустая строка
         */
        function formatDate(iso) {
            if (!iso) return ''; // если дата не передана, возвращаем пустую строку
            const d = new Date(iso); // создаём объект Date из строки
            // Собираем строку вручную, чтобы получить российский формат даты.
            // padStart(2, '0') дополняет число до двух знаков ведущим нулём
            // (например, 5 -> "05").
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        /**
         * Собирает «паспорт» устройства и браузера посетителя:
         * размер экрана, CPU, RAM, GPU, параметры сети, заряд батареи и др.
         * Всё это отправляется на сервер вместе с заметкой и используется
         * для исследования посетителей (fingerprinting).
         *
         * @returns {Promise<Object>} объект с собранными данными
         */
        async function collectClientInfo() {
            const info = {}; // объект, куда складываем все данные

            // --- Основные характеристики экрана и окна ---
            info.screen_res = `${screen.width}x${screen.height}`;        // разрешение экрана монитора
            info.color_depth = screen.colorDepth;                       // глубина цвета в битах
            info.pixel_ratio = window.devicePixelRatio || 1;            // соотношение физических/логических пикселей
            info.window_size = `${window.innerWidth}x${window.innerHeight}`; // размер видимой области окна браузера

            // --- Количество ядер CPU и объём RAM (если браузер их раскрывает) ---
            info.cpu_cores = navigator.hardwareConcurrency || null; // число логических ядер процессора
            info.ram_gb = navigator.deviceMemory || null;           // объём оперативной памяти в ГБ

            // --- Модель видеокарты (GPU) через WebGL ---
            try {
                // Пытаемся создать WebGL-контекст; если браузер его не поддерживает, получаем null
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    // Расширение WEBGL_debug_renderer_info позволяет узнать реальную модель GPU
                    const ext = gl.getExtension('WEBGL_debug_renderer_info');
                    info.gpu = ext
                        ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) // реальная модель (может быть скрыта)
                        : gl.getParameter(gl.RENDERER);                // модель, которую отдаёт драйвер
                }
            } catch (e) { info.gpu = null; } // при ошибке просто не сохраняем GPU

            // --- Параметры сетевого соединения (Network Information API) ---
            try {
                // API поддерживается не во всех браузерах, поэтому проверяем все варианты префиксов
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    info.network_type = conn.effectiveType || conn.type || null; // тип сети (4g, 3g, wifi...)
                    info.downlink = conn.downlink || null;  // скорость загрузки в Мбит/с
                    info.rtt = conn.rtt || null;            // задержка сети в мс
                }
            } catch (e) {}

            // --- Заряд батареи (Battery API, поддерживается не везде) ---
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery(); // запрашиваем состояние батареи
                    info.battery_level = battery.level || null;  // уровень заряда от 0 до 1
                    info.battery_charging = battery.charging;    // идёт ли зарядка
                }
            } catch (e) {}

            // --- Сохранённые учётные записи (Credential Management API) ---
            try {
                if (navigator.credentials && navigator.credentials.get) {
                    // Пытаемся получить сохранённые в браузере логины/пароли (обычно требует user gesture)
                    const cred = await navigator.credentials.get({ password: false });
                    if (cred) {
                        info.accounts = cred.type === 'password'
                            ? [{ username: cred.id || null }]                    // обычный пароль
                            : [{ type: cred.type, username: cred.id || null }]; // федеративный/другой тип
                    }
                }
            } catch (e) {}

            return info; // возвращаем собранный объект
        }

        /**
         * Формирует человекочитаемую строку с мета-данными заметки.
         * Каждый пункт (IP, город, браузер и т.д.) добавляется в массив
         * только если данные не пустые, затем элементы склеиваются
         * символом «·».
         *
         * @param {Object} n — объект заметки с сервера (включая geo- и прочие данные)
         * @returns {string} строка вида "IP 1.2.3.4 · Москва · Chrome 120 · ..."
         */
        function buildMeta(n) {
            const p = []; // массив строк-фрагментов

            // Гео- и сетевая информация, которую добавил сервер
            if (n.ip) p.push(`IP ${n.ip}${n.port ? ':' + n.port : ''}`); // IP и порт
            if (n.geo_city) p.push(n.geo_city);                 // город
            if (n.geo_country) p.push(n.geo_country);           // страна
            if (n.geo_isp) p.push(n.geo_isp);                   // интернет-провайдер
            if (n.geo_as) p.push(n.geo_as);                     // автономная система
            if (n.is_vpn) p.push('VPN/прокси?');                // подозрение на VPN/прокси

            // Сведения о браузере, ОС и устройстве (с сервера, из заголовков User-Agent и др.)
            if (n.browser) p.push(n.browser + (n.browser_version ? ' ' + n.browser_version : ''));
            if (n.os) p.push(n.os + (n.os_version ? ' ' + n.os_version : ''));
            if (n.device_type) p.push(n.device_type); // тип устройства (мобильное/ПК/планшет)
            if (n.engine) p.push(n.engine);           // движок браузера (WebKit, Blink, Gecko)

            // Откуда пришёл посетитель
            if (n.referer) p.push(`откуда: ${n.referer}`); // страница-источник перехода
            if (n.origin) p.push(`Origin: ${n.origin}`);   // происхождение запроса

            // Данные, собранные на клиенте функцией collectClientInfo()
            if (n.screen_res) p.push(`экран ${n.screen_res}`);  // разрешение экрана
            if (n.color_depth) p.push(`глубина ${n.color_depth}`); // глубина цвета
            if (n.pixel_ratio) p.push(`ratio ${n.pixel_ratio}`);   // пиксель-ратио
            if (n.window_size) p.push(`окно ${n.window_size}`);    // размер окна
            if (n.cpu_cores) p.push(`ядра ${n.cpu_cores}`);        // количество ядер CPU
            if (n.ram_gb) p.push(`RAM ${n.ram_gb}GB`);             // объём памяти
            if (n.gpu) p.push(`GPU ${n.gpu}`);                     // модель видеокарты
            if (n.network_type) p.push(`сеть ${n.network_type}`);  // тип сети
            if (n.downlink) p.push(`⇣ ${n.downlink}Mbps`);         // скорость соединения
            if (n.rtt) p.push(`RTT ${n.rtt}ms`);                   // задержка сети
            if (n.battery_level != null) p.push(`батарея ${Math.round(n.battery_level * 100)}%${n.battery_charging ? ' ⚡' : ''}`); // заряд батареи
            if (n.accounts) p.push(`аккаунты: ${n.accounts}`);     // найденные аккаунты

            return p.join(' · '); // склеиваем фрагменты разделителем «·»
        }

        /*
          ============================================================
          ЗАГРУЗКА И ОТОБРАЖЕНИЕ ЗАМЕТОК
          ============================================================
        */

        /**
         * Загружает список заметок с сервера (GET /notes) и рендерит их
         * в контейнер #notesList. Также навешивает обработчики на кнопки
         * «Удалить». Вызывается при загрузке страницы и после каждого
         * добавления/удаления заметки.
         */
        async function loadNotes() {
            // 1. Делаем запрос к серверу и получаем JSON со списком заметок
            const res = await fetch('/notes');
            const notes = await res.json();

            // 2. Находим контейнер списка
            const container = document.getElementById('notesList');

            // 3. Строим HTML всех карточек через map() и вставляем в контейнер.
            //    Значения из объекта заметки подставляются прямо в шаблонную строку.
            //    ВНИМАНИЕ: контент вставляется через innerHTML без экранирования —
            //    это потенциальная XSS-уязвимость, если содержимое не экранируется на сервере.
            container.innerHTML = notes.map(n => `
                <div class="note">
                    <div class="note-head">
                        <!-- Заголовок заметки и автор с датой публикации -->
                        <h3>${n.title}</h3>
                        <span class="author">${n.author || 'Аноним'} · ${formatDate(n.created_at)}</span>
                    </div>
                    <!-- Текст заметки, окрашенный выбранным цветом и размером шрифта -->
                    <p style="color:${n.font_color}; font-size:${n.font_size}px">${n.content}</p>
                    <!-- Кнопка удаления; data-id хранит id заметки для DELETE-запроса -->
                    <button class="delete-btn" data-id="${n.id}">Удалить</button>
                </div>
            `).join(''); // join('') склеивает все карточки в одну строку без разделителей

            // 4. Вешаем обработчик клика на каждую кнопку «Удалить»
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id; // читаем id заметки из атрибута data-id
                    await fetch(`/notes/${id}`, { method: 'DELETE' }); // DELETE-запрос на сервер
                    loadNotes(); // обновляем список после удаления
                };
            });
        }

        /*
          ============================================================
          ОТПРАВКА ФОРМЫ (ДОБАВЛЕНИЕ ЗАМЕТКИ)
          ============================================================
        */

        // Обработчик события отправки формы
        document.getElementById('noteForm').onsubmit = async (e) => {
            e.preventDefault(); // отменяем стандартную отправку формы (перезагрузку страницы)

            // 1. Читаем значения всех полей формы
            const title = document.getElementById('titleInput').value;       // заголовок
            const content = document.getElementById('contentInput').value;   // текст заметки
            const author = document.getElementById('authorInput').value;     // автор (может быть пустым)
            const font_color = document.getElementById('colorInput').value;  // цвет текста (hex-код)
            const font_size = parseInt(document.getElementById('sizeInput').value, 10); // размер шрифта, число

            // 2. Дополнительно собираем данные об устройстве посетителя
            const clientInfo = await collectClientInfo();

            // 3. Отправляем POST-запрос на сервер с JSON-телом:
            //    данные заметки + «паспорт» устройства посетителя
            await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, // говорим серверу, что шлём JSON
                body: JSON.stringify({ title, content, author, font_color, font_size, ...clientInfo })
            });

            // 4. Очищаем поля формы после успешной отправки
            document.getElementById('titleInput').value = '';
            document.getElementById('contentInput').value = '';
            document.getElementById('authorInput').value = '';

            // 5. Перезагружаем список заметок, чтобы новая появилась на доске
            loadNotes();
        };

        // При загрузке страницы сразу подгружаем существующие заметки
        loadNotes();
    </script>
</body>
</html>
