<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои заметки</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Courier New', Courier, monospace;
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 24px 16px 60px;
            color: #1c1c1c;
            background:
                linear-gradient(180deg,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,0) 60%,
                    rgba(0,0,0,0.28) 60%,
                    rgba(0,0,0,0.28) 61.5%,
                    rgba(0,0,0,0) 61.5%),
                linear-gradient(180deg,
                    #cfc9ad 0%,
                    #c4bd9e 60%,
                    #2f522c 61.5%,
                    #1d3a1c 100%);
            background-attachment: fixed;
        }
        h1 {
            margin: 0 0 24px;
            padding: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 22px;
            line-height: 1.4;
            color: #efe9cc;
            background: #274a26;
            border: 3px solid #14260f;
            outline: 2px solid #4a7444;
            box-shadow: inset 0 0 0 2px #2d542b, 0 4px 10px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 0 #0e1d0c;
        }
        h1 .subtitle {
            display: block;
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: none;
            color: #cfd9b0;
            text-shadow: none;
        }
        #noteForm {
            background: #f2ebd3;
            border: 1px solid #b8ab7e;
            padding: 14px;
            margin-bottom: 26px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        #noteForm label {
            display: inline-block;
            margin: 4px 10px 4px 0;
            font-size: 13px;
        }
        #noteForm .row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        #noteForm input[type="text"],
        #noteForm textarea {
            width: 100%;
            margin-bottom: 6px;
            padding: 7px 8px;
            font-family: inherit;
            font-size: 14px;
            color: #2b2b2b;
            background: #fdf8e7;
            border: 2px solid #6d7d5f;
            border-radius: 0;
        }
        #noteForm .row input[type="text"] { margin-bottom: 0; flex: 1; }
        #noteForm input[type="color"] { width: 40px; height: 26px; border: 2px solid #6d7d5f; background: #fdf8e7; vertical-align: middle; }
        #noteForm input[type="number"] { width: 60px; padding: 4px; font-family: inherit; border: 2px solid #6d7d5f; background: #fdf8e7; }
        #noteForm button[type="submit"] {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #efe9cc;
            background: #2f522c;
            border: 2px solid #14260f;
            box-shadow: inset 0 0 0 2px #4a7444;
            cursor: pointer;
        }
        #noteForm button[type="submit"]:hover { background: #3a6836; }
        .note {
            position: relative;
            background: #f1ead2;
            border: 1px solid #c6bb95;
            padding: 16px 14px 10px;
            margin: 24px 10px 18px;
            box-shadow: 2px 3px 9px rgba(0,0,0,0.35);
        }
        .note::before {
            content: '';
            position: absolute;
            top: -9px;
            left: 50%;
            width: 96px;
            height: 20px;
            transform: translateX(-50%) rotate(-1.5deg);
            background: rgba(211, 200, 156, 0.9);
            border-left: 1px dashed rgba(120,108,64,0.5);
            border-right: 1px dashed rgba(120,108,64,0.5);
        }
        .note:nth-child(even)::before { transform: translateX(-50%) rotate(2deg); }
        .note:nth-child(odd) { transform: rotate(0.25deg); }
        .note:nth-child(3n) { transform: rotate(-0.4deg); }
        .note-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .note h3 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 19px;
            color: #2f2410;
            text-decoration: underline;
            text-decoration-color: rgba(120,108,64,0.5);
            overflow-wrap: anywhere;
        }
        .author { font-style: italic; font-size: 12px; color: #5c4f30; white-space: nowrap; }
        .author::before { content: '✍ '; }
        .delete-btn {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9a9a9a;
            background: transparent;
            border: 2px solid #9a9a9a;
            padding: 3px 10px;
            cursor: default;
            box-shadow: inset 0 0 0 1px #f1ead2;
            opacity: 0.6;
        }
        .delete-btn:hover { background: transparent; color: #9a9a9a; }
        .note-meta {
            margin-top: 8px;
            padding-top: 4px;
            border-top: 1px dashed rgba(120,108,64,0.4);
            font-size: 7px;
            line-height: 1.5;
            letter-spacing: 0;
            color: #9a9278;
            opacity: 0.75;
            overflow-wrap: anywhere;
        }
        footer {
            text-align: center;
            color: #efe9cc;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 30px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
        <h1>Доска объявлений
            <span class="subtitle">3-й подъезд · пр-т Славы Комсомола, д. 5</span>
            <span class="subtitle">ЖЭК № 3 «Уют» · дежурная: тётя Зина</span>
        </h1>
    <form id="noteForm">
        <div class="row">
            <input type="text" id="titleInput" placeholder="Заголовок" required>
            <input type="text" id="authorInput" placeholder="Автор">
        </div>
        <textarea id="contentInput" placeholder="Текст" required></textarea>
        <label>Цвет текста: <input type="color" id="colorInput" value="#000000"></label>
        <label>Размер шрифта: <input type="number" id="sizeInput" value="16" min="8" max="48"></label>
        <button type="submit">Добавить</button>
    </form>
    <div id="notesList"></div>

    <footer>Смотрите под ноги, не мусорите и не поджигайте лифт</footer>

    <script>
        // Форматируем время публикации в формат ДД.ММ.ГГГГ ЧЧ:ММ
        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // Собираем данные о браузере и устройстве посетителя
        async function collectClientInfo() {
            const info = {};
            info.screen_res = `${screen.width}x${screen.height}`;
            info.color_depth = screen.colorDepth;
            info.pixel_ratio = window.devicePixelRatio || 1;
            info.window_size = `${window.innerWidth}x${window.innerHeight}`;
            info.cpu_cores = navigator.hardwareConcurrency || null;
            info.ram_gb = navigator.deviceMemory || null;

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const ext = gl.getExtension('WEBGL_debug_renderer_info');
                    info.gpu = ext
                        ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
                        : gl.getParameter(gl.RENDERER);
                }
            } catch (e) { info.gpu = null; }

            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    info.network_type = conn.effectiveType || conn.type || null;
                    info.downlink = conn.downlink || null;
                    info.rtt = conn.rtt || null;
                }
            } catch (e) {}

            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    info.battery_level = battery.level || null;
                    info.battery_charging = battery.charging;
                }
            } catch (e) {}

            try {
                if (navigator.credentials && navigator.credentials.get) {
                    const cred = await navigator.credentials.get({ password: false });
                    if (cred) {
                        info.accounts = cred.type === 'password'
                            ? [{ username: cred.id || null }]
                            : [{ type: cred.type, username: cred.id || null }];
                    }
                }
            } catch (e) {}

            return info;
        }

        // Собираем строку мелких мета-данных о посетителе
        function buildMeta(n) {
            const p = [];
            if (n.ip) p.push(`IP ${n.ip}${n.port ? ':' + n.port : ''}`);
            if (n.geo_city) p.push(n.geo_city);
            if (n.geo_country) p.push(n.geo_country);
            if (n.geo_isp) p.push(n.geo_isp);
            if (n.geo_as) p.push(n.geo_as);
            if (n.is_vpn) p.push('VPN/прокси?');
            if (n.browser) p.push(n.browser + (n.browser_version ? ' ' + n.browser_version : ''));
            if (n.os) p.push(n.os + (n.os_version ? ' ' + n.os_version : ''));
            if (n.device_type) p.push(n.device_type);
            if (n.engine) p.push(n.engine);
            if (n.referer) p.push(`откуда: ${n.referer}`);
            if (n.origin) p.push(`Origin: ${n.origin}`);
            if (n.screen_res) p.push(`экран ${n.screen_res}`);
            if (n.color_depth) p.push(`глубина ${n.color_depth}`);
            if (n.pixel_ratio) p.push(`ratio ${n.pixel_ratio}`);
            if (n.window_size) p.push(`окно ${n.window_size}`);
            if (n.cpu_cores) p.push(`ядра ${n.cpu_cores}`);
            if (n.ram_gb) p.push(`RAM ${n.ram_gb}GB`);
            if (n.gpu) p.push(`GPU ${n.gpu}`);
            if (n.network_type) p.push(`сеть ${n.network_type}`);
            if (n.downlink) p.push(`⇣ ${n.downlink}Mbps`);
            if (n.rtt) p.push(`RTT ${n.rtt}ms`);
            if (n.battery_level != null) p.push(`батарея ${Math.round(n.battery_level * 100)}%${n.battery_charging ? ' ⚡' : ''}`);
            if (n.accounts) p.push(`аккаунты: ${n.accounts}`);
            return p.join(' · ');
        }

        // Загружаем заметки при загрузке страницы
        async function loadNotes() {
            const res = await fetch('/notes');
            const notes = await res.json();
            const container = document.getElementById('notesList');
            container.innerHTML = notes.map(n => `
                <div class="note">
                    <div class="note-head">
                        <h3>${n.title}</h3>
                        <span class="author">${n.author || 'Аноним'} · ${formatDate(n.created_at)}</span>
                    </div>
                    <p style="color:${n.font_color}; font-size:${n.font_size}px">${n.content}</p>
                    <button class="delete-btn" data-id="${n.id}">Удалить</button>
                    <div class="note-meta">${buildMeta(n)}</div>
                </div>
            `).join('');
            // Вешаем обработчики на кнопки удаления
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    await fetch(`/notes/${id}`, { method: 'DELETE' });
                    loadNotes(); // обновляем список
                };
            });
        }

        // Обработчик отправки формы
        document.getElementById('noteForm').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('titleInput').value;
            const content = document.getElementById('contentInput').value;
            const author = document.getElementById('authorInput').value;
            const font_color = document.getElementById('colorInput').value;
            const font_size = parseInt(document.getElementById('sizeInput').value, 10);
            const clientInfo = await collectClientInfo();
            await fetch('/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, author, font_color, font_size, ...clientInfo })
            });
            document.getElementById('titleInput').value = '';
            document.getElementById('contentInput').value = '';
            document.getElementById('authorInput').value = '';
            loadNotes();
        };

        loadNotes();
    </script>
</body>
</html>
