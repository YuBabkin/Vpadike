<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Привет</title>
</head>
<body>
    <h1 id="counter">привет 1</h1>
    <button id="btn">+1</button>

    <script>
        document.getElementById('btn').onclick = async () => {
            const res = await fetch('/inc');
            const data = await res.json();
            document.getElementById('counter').textContent = 'привет ' + data.count;
        };
    </script>
</body>
</html>
